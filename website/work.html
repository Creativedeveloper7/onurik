  /* Conversion bridge (shared with home) */
  .conversion-bridge-slide {

    transition: opacity 0.55s ease-in-out, transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
  }
  .conversion-bridge-slide.is-active { opacity: 1; transform: none; pointer-events: auto; }
  #conversion-bridge .bridge-shell { opacity: 0; transform: translateY(1.25rem); }
  #conversion-bridge.is-visible .bridge-shell { opacity: 1; transform: none; transition: opacity 0.85s ease-out, transform 0.85s ease-out; }
  @media (prefers-reduced-motion: reduce) {
    .conversion-bridge-slide { transition: none; }
    .conversion-bridge-slide:not(.is-active) { visibility: hidden; }

  }

<script>
(function () {
  var btn = document.getElementById("site-mobile-menu-btn");
  var drawer = document.getElementById("site-nav-drawer");
  var overlay = document.querySelector(".site-nav-overlay");
  if (!btn || !drawer || !overlay) return;
  function setOpen(open) {
    drawer.classList.toggle("open", open);
    drawer.setAttribute("aria-hidden", open ? "false" : "true");
    overlay.classList.toggle("open", open);
    overlay.setAttribute("aria-hidden", open ? "false" : "true");
    btn.setAttribute("aria-expanded", open ? "true" : "false");
    document.documentElement.style.overflow = open ? "hidden" : "";
  }
  btn.addEventListener("click", function () {
    setOpen(!drawer.classList.contains("open"));
  });
  overlay.addEventListener("click", function () {
    setOpen(false);
  });
  drawer.querySelectorAll("a").forEach(function (link) {
    link.addEventListener("click", function () {
      setOpen(false);
    });
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") setOpen(false);
  });
})();
</script>
