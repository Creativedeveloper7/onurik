<meta name="theme-color" content="#0A0A0B"/>
<title>My Cart · Onurik Shop</title>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
  .material-symbols-outlined { font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 24; }
  #site-nav-drawer { transform: translateX(100%); transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }
  #site-nav-drawer.open { transform: translateX(0); }
  .site-nav-overlay.open { opacity: 1 !important; pointer-events: auto !important; }

<link rel="stylesheet" href="/styles/animations.css"/>
<link rel="stylesheet" href="/styles/brand.css"/>

<body class="shop-page min-h-screen flex flex-col font-body-md antialiased">
<nav class="ob-nav fixed top-0 z-50 flex h-[4.5rem] w-full items-center gap-3 px-5 sm:px-8 md:px-12">
<a href="/" class="ob-nav__logo shrink-0" aria-label="Onurik home"><img src="/brand/onurik-logo.svg" alt="" class="ob-logo" width="143" height="100"/></a>
<div class="ml-auto hidden md:flex items-center gap-9">
<a href="/works" class="ob-nav__link">Works</a>
<a href="/about" class="ob-nav__link">About</a>
<a href="/shop" class="ob-nav__link">Shop</a>
<a href="/contact" class="ob-nav__cta" data-ob-magnet="0.3">Contact <span class="material-symbols-outlined text-base" aria-hidden="true">north_east</span></a>
</div>
<div class="ml-auto flex shrink-0 items-center gap-2 md:ml-6">
<button type="button" id="shop-search-btn" class="inline-flex h-11 w-11 items-center justify-center rounded-full border border-white/15 bg-white/5 text-cream backdrop-blur transition-colors hover:border-mustard hover:text-mustard" aria-label="Search shop">
<span class="material-symbols-outlined text-[22px]" aria-hidden="true">search</span>
</button>
<a href="/shop/cart" class="relative inline-flex h-11 w-11 items-center justify-center rounded-full bg-mustard text-white shadow-glow transition-transform hover:-translate-y-0.5" aria-label="Cart" aria-current="page">
<span class="material-symbols-outlined text-[22px]" aria-hidden="true">shopping_bag</span>
<span id="shop-cart-count" class="absolute -right-1.5 -top-1.5 flex h-5 min-w-5 items-center justify-center rounded-full border-2 border-[#0a0a0b] bg-cream px-1 font-mono text-[10px] font-bold text-[#0a0a0b]" hidden>0</span>
</a>
<button type="button" class="md:hidden inline-flex h-11 w-11 items-center justify-center rounded-full border border-white/15 bg-white/5 text-cream backdrop-blur" aria-expanded="false" aria-controls="site-nav-drawer" id="site-mobile-menu-btn">
<span class="material-symbols-outlined text-2xl" aria-hidden="true">menu</span>
<span class="sr-only">Open menu</span>
</button>
</div>
</nav>
<div class="site-nav-overlay fixed inset-0 z-40 md:hidden opacity-0 pointer-events-none bg-ink/70 backdrop-blur-sm transition-opacity duration-300" aria-hidden="true"></div>
<nav id="site-nav-drawer" class="ob-drawer ob-grain fixed top-0 right-0 z-50 h-full w-[min(100vw,20rem)] md:hidden pt-24 px-8 flex flex-col gap-5 shadow-2xl" aria-hidden="true" aria-label="Mobile">
<a href="/works" class="ob-drawer__link">Works</a>
<a href="/about" class="ob-drawer__link">About</a>
<a href="/shop" class="ob-drawer__link">Shop</a>
<a href="/contact" class="ob-drawer__link">Contact</a>
<a href="/shop/cart" class="ob-btn ob-btn--red mt-6 self-start" aria-current="page"><span class="material-symbols-outlined" aria-hidden="true">shopping_bag</span>Cart</a>
<p class="ob-marker mt-auto mb-10 text-xl">wear the work</p>
</nav>
<main class="flex-grow pt-28 pb-24 px-5 sm:px-8 md:px-12 w-full max-w-container-max mx-auto">
<div id="shop-app"></div>
</main>
<footer class="ob-bg-ink ob-grain relative mt-auto w-full overflow-hidden">
<div class="mx-auto max-w-[1440px] px-5 pt-16 sm:px-8 md:px-12">
<div class="flex flex-col gap-10 md:flex-row md:items-end md:justify-between">
<div>
<p class="ob-letter text-3xl text-mustard md:text-4xl" data-ob-chars="wobble">Got an idea?</p>
<a href="/contact" class="ob-marker mt-2 inline-block text-xl text-cream/80 hover:text-tomato transition-colors">say hello → let’s build it</a>
</div>
<ul data-onurik-social-footer class="flex flex-wrap gap-6 ob-mono text-[11px] uppercase tracking-[0.18em] text-cream/70" aria-label="Social links" hidden></ul>
</div>
<p class="ob-footer__giant ob-outline mt-12 select-none text-center text-mustard" style="--ob-outline-color:#F2A516" data-ob-chars="wave" data-ob-amp="0.6" aria-hidden="true">Onurik</p>
<div class="flex flex-col items-center justify-between gap-3 border-t-2 border-cream/10 py-6 ob-mono text-[10px] uppercase tracking-[0.2em] text-cream/45 md:flex-row">
<span>© 2026 Onurik — branding, web design &amp; product studio · Nairobi, Kenya</span>
<a href="/shop/returns" class="hover:text-mustard transition-colors">Returns &amp; refunds</a>
</div>
</div>
</footer>
<script type="module">
  import { initShopShell } from "/shop/shop-shell.js";
  import { mountCartPage } from "/shop/CartPage.js";
  initShopShell().then(function () {
    mountCartPage(document.getElementById("shop-app"));
  });
</script>
<script type="module" src="/scripts/animations.js"></script>
<script type="module" src="/scripts/brand-fx.js"></script>
<script type="module" src="/scripts/nav-close.js"></script>
<script type="module" src="/scripts/whatsapp-float.js"></script>
<script type="module" src="/scripts/site-social-links.js"></script>
<script type="module" src="/scripts/vercel-analytics.js"></script>
</body>
</html>
